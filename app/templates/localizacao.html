<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="get">
        <input type="text" name="nome" placeholder="Nome da localização" value="{{ nome|default:'' }}">
        <button type="submit">Buscar</button>
    </form>

    {% if erro %}
        <p style="color:red">{{ erro }}</p>
    {% endif %}

    {% if info %}
        <ul>
            {% for item in info %}
                <li>
                    <strong>{{ item.name }}</strong> (ID: {{ item.id }})
                    <br>Tipo: {{ item.type }}
                    <br>Dimensão: {{ item.dimension }}
                    <br>Número de residentes: {{ item.residents|length }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
